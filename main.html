<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-0: PLATINUM DRAFT - Music Supergroup Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        studio: {
                            950: '#06080D',
                            900: '#0D111A',
                            800: '#161C2B',
                            700: '#232C42',
                            600: '#344263'
                        },
                        gold: {
                            300: '#FDE047',
                            400: '#FBBF24',
                            500: '#F59E0B',
                            600: '#D97706',
                        },
                        neon: {
                            cyan: '#06B6D4',
                            pink: '#EC4899',
                            purple: '#A855F7',
                            green: '#10B981'
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 10s linear infinite',
                        'spin-fast': 'spin 1s linear infinite',
                        'pulse-glow': 'pulseGlow 2s infinite alternate',
                        'bounce-short': 'bounceShort 0.6s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { boxShadow: '0 0 10px rgba(6, 182, 212, 0.2)' },
                            '100%': { boxShadow: '0 0 25px rgba(6, 182, 212, 0.6)' },
                        },
                        bounceShort: {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(-4px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #06080D;
            color: #F8FAFC;
            user-select: none;
            overflow-x: hidden;
        }

        .studio-glass {
            background: rgba(13, 17, 26, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFE066 0%, #F59E0B 50%, #B45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cyan-gradient-text {
            background: linear-gradient(135deg, #A5F3FC 0%, #06B6D4 50%, #0369A1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .purple-gradient-text {
            background: linear-gradient(135deg, #F0ABFC 0%, #A855F7 50%, #6B21A8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Vinyl Grooves Graphics */
        .vinyl-grooves {
            background: repeating-radial-gradient(
                circle at center,
                #090d14 0px,
                #090d14 2px,
                #1a2233 3px,
                #090d14 4px
            );
        }

        /* 3D Card Flip Animation */
        .flip-card {
            perspective: 1000px;
        }

        .flip-card-inner {
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #06080D;
        }
        ::-webkit-scrollbar-thumb {
            background: #161C2B;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06B6D4;
        }
    </style>
</head>
